name: MCP native and source validation

on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/mcp/**', '3rdparty/clipper/**', '3rdparty/pdfium/**', '3rdparty/zxing/**', '3rdparty/zxing-integration/**', 'CMakeLists.txt', '.github/workflows/mcp-vision-tools.yml']
  push:
    branches: [mcp-vision-tools, mcp-prebuilt-wheels, mcp-source-install, codex/mcp-upstream-readiness]
    paths: ['apps/mcp/**', '3rdparty/clipper/**', '3rdparty/pdfium/**', '3rdparty/zxing/**', '3rdparty/zxing-integration/**', 'CMakeLists.txt', '.github/workflows/mcp-vision-tools.yml']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONNOUSERSITE: '1'
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_CACHE_DIR: '1'
  UV_NO_CACHE: '1'

jobs:
  linux:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      payload_sha256: ${{ steps.validate.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test PDFium dependency verification
        run: python -m unittest discover -s 3rdparty/pdfium -p 'test_*.py'
      - id: validate
        name: Build ZIP, clean install and native contracts
        run: python apps/mcp/dev/validate_package.py --feature-tests --search-tests --work "$RUNNER_TEMP/mcp-validation"
      - name: Retain native evidence and tested wheel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-native-linux-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/mcp-validation/*report.json
            ${{ runner.temp }}/mcp-validation/payload-manifest.json
            ${{ runner.temp }}/mcp-validation/tests.xml
            ${{ runner.temp }}/mcp-validation/logs/*.log
            ${{ runner.temp }}/mcp-validation/platform*/*.json
            ${{ runner.temp }}/mcp-validation/search/search-report.json
            ${{ runner.temp }}/mcp-validation/search/mcp-stderr.log
            ${{ runner.temp }}/mcp-validation/search/photos/*.png
            ${{ runner.temp }}/mcp-validation/search/indexes/*.sqlite
            ${{ runner.temp }}/mcp-validation/dist/*

  native:
    needs: linux
    if: ${{ github.event.repository.private == false }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Preserve checkout line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.runner == 'macos-15' && 'arm64' || 'x64' }}
      - name: Build ZIP, clean install and native contracts
        shell: bash
        run: python apps/mcp/dev/validate_package.py --feature-tests --search-tests --work "$RUNNER_TEMP/mcp-validation"
      - name: Retain native evidence and tested wheel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-native-${{ matrix.runner }}-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/mcp-validation/*report.json
            ${{ runner.temp }}/mcp-validation/payload-manifest.json
            ${{ runner.temp }}/mcp-validation/tests.xml
            ${{ runner.temp }}/mcp-validation/logs/*.log
            ${{ runner.temp }}/mcp-validation/platform*/*.json
            ${{ runner.temp }}/mcp-validation/search/search-report.json
            ${{ runner.temp }}/mcp-validation/search/mcp-stderr.log
            ${{ runner.temp }}/mcp-validation/search/photos/*.png
            ${{ runner.temp }}/mcp-validation/search/indexes/*.sqlite
            ${{ runner.temp }}/mcp-validation/dist/*

  source:
    needs: linux
    if: ${{ github.event.repository.private == false }}
    concurrency:
      group: mcp-source-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare isolated package environment
        run: python apps/mcp/dev/validate_package.py --prepare-only --work "$RUNNER_TEMP/mcp-validation"
      - name: Compile OpenCV and verify native C++ and all ten MCP features
        run: python apps/mcp/dev/validate_opencv_source.py --work "$RUNNER_TEMP/mcp-validation"
      - name: Retain source-build and search evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-source-linux-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/mcp-validation/*report.json
            ${{ runner.temp }}/mcp-validation/logs/*.log
            ${{ runner.temp }}/mcp-validation/source-imports/*.json
            ${{ runner.temp }}/mcp-validation/source-search/search-report.json
            ${{ runner.temp }}/mcp-validation/source-search/mcp-stderr.log
